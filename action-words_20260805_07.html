<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>단어 듣기 · Word Player</title>
<style>
  :root{
    --coral:#C8503C;
    --coral-soft:#FBEDE8;
    --ink:#1F2A44;
    --sub:#5A6478;
    --border:#E2D8CD;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--coral-soft);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .card{
    width:100%;
    max-width:420px;
    background:#fff;
    border:1px solid var(--border);
    border-radius:20px;
    padding:32px 28px 28px;
    text-align:center;
    box-shadow:0 8px 30px rgba(31,42,68,.08);
  }
  .progress{
    color:var(--sub);
    font-size:14px;
    font-weight:600;
    letter-spacing:.02em;
  }
  .mode-tag{
    display:inline-block;
    margin-left:6px;
    padding:1px 8px;
    border-radius:99px;
    background:var(--coral-soft);
    color:var(--coral);
    font-size:11px;
    font-weight:700;
    vertical-align:1px;
  }
  .bar{
    height:6px;
    background:var(--border);
    border-radius:99px;
    margin:10px 0 26px;
    overflow:hidden;
  }
  .bar-fill{
    height:100%;
    background:var(--coral);
    border-radius:99px;
    transition:width .25s ease;
    width:0%;
  }
  .word{
    font-size:38px;
    font-weight:800;
    color:var(--ink);
    line-height:1.15;
    word-break:keep-all;
    min-height:46px;
  }
  .mean{
    margin-top:8px;
    font-size:17px;
    color:var(--sub);
    min-height:24px;
  }
  .example{
    margin-top:20px;
    background:var(--coral-soft);
    border-radius:12px;
    padding:14px 16px;
    font-size:15px;
    color:var(--ink);
    min-height:24px;
    line-height:1.5;
  }
  .controls{
    display:flex;
    gap:10px;
    margin-top:26px;
  }
  button{
    font-family:inherit;
    border:none;
    border-radius:14px;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .btn-replay{
    flex:0 0 56px;
    height:56px;
    background:#fff;
    border:2px solid var(--coral);
    color:var(--coral);
    font-size:22px;
  }
  .btn-pause{
    flex:0 0 56px;
    height:56px;
    background:#fff;
    border:2px solid var(--ink);
    color:var(--ink);
    font-size:20px;
  }
  .btn-pause.is-paused{
    background:var(--coral);
    border-color:var(--coral);
    color:#fff;
  }
  .btn-next{
    flex:1;
    height:56px;
    background:var(--coral);
    color:#fff;
    font-size:18px;
    font-weight:700;
  }
  .btn-next:disabled{
    background:#D9C9C2;
    cursor:default;
  }
  .row-secondary{
    display:flex;
    gap:8px;
    margin-top:10px;
  }
  .btn-prev, .btn-start, .btn-shuffle{
    flex:1;
    height:44px;
    background:none;
    color:var(--sub);
    font-size:13px;
    border:1px solid var(--border);
    border-radius:12px;
    padding:0 4px;
  }
  .btn-shuffle.is-on{
    border-color:var(--coral);
    color:var(--coral);
    background:var(--coral-soft);
    font-weight:700;
  }
  .start-shuffle-row{
    margin-top:10px;
  }
  .start-shuffle-row .btn-shuffle{
    width:100%;
    height:44px;
  }
  .ko{
    margin-top:6px;
    padding-top:6px;
    border-top:1px dashed rgba(31,42,68,.12);
    font-size:13px;
    min-height:18px;
  }
  .btn-mean{
    width:100%;
    height:44px;
    margin-top:16px;
    background:#fff;
    border:2px dashed var(--sub);
    color:var(--sub);
    font-size:14px;
    font-weight:700;
    border-radius:12px;
  }
  .btn-mean.is-revealed{
    border-style:solid;
    border-color:var(--coral);
    color:var(--coral);
    background:var(--coral-soft);
  }
  .start-screen .word{font-size:22px; color:var(--sub); font-weight:600;}
  .hidden{display:none;}
  .foot{
    margin-top:18px;
    font-size:11.5px;
    color:#9aa3b2;
  }
  .status{
    margin-top:10px;
    font-size:12.5px;
    color:#B23A2E;
    min-height:16px;
  }
  .practice{
    margin-top:20px;
    text-align:left;
    border-top:1px dashed rgba(31,42,68,.15);
    padding-top:14px;
  }
  .practice-title{
    font-size:12.5px;
    font-weight:700;
    color:var(--sub);
    margin-bottom:8px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .practice-reset{
    font-size:11.5px;
    color:#9aa3b2;
    background:none;
    border:none;
    text-decoration:underline;
    cursor:pointer;
    padding:0;
    border-radius:0;
  }
  .practice-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:7px 0;
  }
  .practice-row + .practice-row{
    border-top:1px solid rgba(31,42,68,.06);
  }
  .practice-label{
    font-size:13px;
    color:var(--ink);
    font-weight:600;
    display:flex;
    align-items:center;
    gap:6px;
    white-space:nowrap;
  }
  .practice-boxes{
    display:flex;
    gap:9px;
  }
  .practice-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 0 4px;
  }
  .practice-header-boxes{
    display:flex;
    gap:9px;
  }
  .practice-header-boxes span{
    flex:0 0 20px;
    width:20px;
    box-sizing:border-box;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:10px;
    color:#9aa3b2;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
  }
  .practice-hint{
    margin-top:10px;
    font-size:11.5px;
    color:#9aa3b2;
    line-height:1.5;
  }
  .practice-boxes input[type=checkbox]{
    flex:0 0 20px;
    width:20px;
    height:20px;
    margin:0;
    accent-color:var(--coral);
    cursor:pointer;
  }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="progress"><span id="progress">0 / 30</span><span class="mode-tag hidden" id="modeTag">퀴즈 · 무작위</span></div>
    <div class="bar"><div class="bar-fill" id="barFill"></div></div>

    <div id="startScreen">
      <div class="word">단어 30개를 들어요</div>
      <div class="mean">시작하면 2초 간격으로 자동으로 다음 단어까지 들려줘요</div>
      <div class="controls">
        <button class="btn-next" id="startBtn" style="flex:1">순서대로 시작</button>
      </div>
      <div class="start-shuffle-row">
        <button class="btn-shuffle" id="shuffleStartBtn">🔀 섞어서 시작 (퀴즈용)</button>
      </div>
    </div>

    <div id="playScreen" class="hidden">
      <div class="word" id="wordEl"></div>
      <div class="mean" id="meanEl"></div>
      <div class="example">
        <div id="exEl"></div>
        <div class="ko" id="koEl"></div>
      </div>
      <button class="btn-mean" id="meanBtn">뜻 보기</button>
      <div class="status" id="statusEl"></div>
      <div class="controls">
        <button class="btn-pause" id="pauseBtn" title="일시정지">&#10074;&#10074;</button>
        <button class="btn-replay" id="replayBtn" title="다시 듣기">&#8635;</button>
        <button class="btn-next" id="nextBtn">다음 단어</button>
      </div>
      <div class="row-secondary">
        <button class="btn-prev" id="prevBtn">이전 단어</button>
        <button class="btn-shuffle" id="shuffleBtn">🔀 섞기</button>
        <button class="btn-start" id="restartBtn">처음부터</button>
      </div>
    </div>

    <div class="practice" id="practiceCheck">
      <div class="practice-title">
        <span>🙋 30개 전체 진행 체크</span>
        <button class="practice-reset" id="practiceResetBtn">전체 초기화</button>
      </div>
      <div class="practice-header">
        <span class="practice-header-label"></span>
        <span class="practice-header-boxes"><span>1회</span><span>2회</span><span>3회</span></span>
      </div>
      <div class="practice-row">
        <span class="practice-label">👂 Listening</span>
        <span class="practice-boxes">
          <input type="checkbox" data-g="l" data-n="0">
          <input type="checkbox" data-g="l" data-n="1">
          <input type="checkbox" data-g="l" data-n="2">
        </span>
      </div>
      <div class="practice-row">
        <span class="practice-label">🔁 Following</span>
        <span class="practice-boxes">
          <input type="checkbox" data-g="f" data-n="0">
          <input type="checkbox" data-g="f" data-n="1">
          <input type="checkbox" data-g="f" data-n="2">
        </span>
      </div>
      <div class="practice-row">
        <span class="practice-label">🗣️ Shadowing</span>
        <span class="practice-boxes">
          <input type="checkbox" data-g="s" data-n="0">
          <input type="checkbox" data-g="s" data-n="1">
          <input type="checkbox" data-g="s" data-n="2">
        </span>
      </div>
      <div class="practice-hint">단어 30개를 한 번 다 들으면(Listening) 1회 체크 → 다 따라 말하면(Following)
        1회 체크 → 다 섀도잉하면(Shadowing) 1회 체크. 이렇게 3바퀴 반복해요.</div>
    </div>

    <div class="foot">단어를 탭하면 다시 들려요 · 기기 내장 음성 사용(인터넷 없이도 재생)<br>진행 체크는 이 기기의 브라우저에 자동 저장돼요<br><span id="setIdTag"></span></div>
  </div>

<script>
var WORDS = [{"w": "wait", "m": "기다리다", "ex": "Please wait for me.", "ko": "나를 기다려 주세요."}, {"w": "smell", "m": "냄새, 냄새가 나다", "ex": "The cookies smell good.", "ko": "그 쿠키는 좋은 냄새가 나요."}, {"w": "grow up", "m": "자라다, 성장하다", "ex": "I want to grow up fast.", "ko": "나는 빨리 자라고 싶어요."}, {"w": "smaller", "m": "더 작은", "ex": "My hand is smaller than yours.", "ko": "내 손은 네 손보다 더 작아요."}, {"w": "board game", "m": "보드게임", "ex": "Let's play a board game.", "ko": "우리 보드게임 하자."}, {"w": "cloth", "m": "천, 헝겊", "ex": "I clean the desk with a cloth.", "ko": "나는 천으로 책상을 닦아요."}, {"w": "higher", "m": "더 높은", "ex": "This tree is higher than my house.", "ko": "이 나무는 우리 집보다 더 높아요."}, {"w": "elevator", "m": "승강기", "ex": "We take the elevator to the fifth floor.", "ko": "우리는 5층까지 승강기를 타요."}, {"w": "restaurant", "m": "음식점", "ex": "My dad works at a restaurant.", "ko": "우리 아빠는 음식점에서 일하세요."}, {"w": "careful", "m": "조심하는", "ex": "Be careful! The floor is wet.", "ko": "조심해! 바닥이 젖었어."}, {"w": "upside down", "m": "거꾸로", "ex": "The picture is upside down.", "ko": "그 그림이 거꾸로 걸려 있어요."}, {"w": "return", "m": "돌아오다", "ex": "I return home at six.", "ko": "나는 여섯 시에 집에 돌아와요."}, {"w": "sneakers", "m": "운동화", "ex": "My new sneakers are white.", "ko": "내 새 운동화는 하얀색이에요."}, {"w": "clean up", "m": "정리하다", "ex": "Let's clean up the classroom.", "ko": "우리 교실을 정리하자."}, {"w": "underground", "m": "지하, 지하의", "ex": "The parking lot is underground.", "ko": "그 주차장은 지하에 있어요."}, {"w": "get on", "m": "타다", "ex": "Get on the bus, please.", "ko": "버스에 타세요."}, {"w": "laugh", "m": "웃다", "ex": "We laugh at the funny movie.", "ko": "우리는 그 재미있는 영화를 보고 웃어요."}, {"w": "tell time", "m": "시간을 말하다", "ex": "Can you tell time?", "ko": "너는 시간을 말할 수 있니?"}, {"w": "wrist", "m": "손목", "ex": "My watch is on my wrist.", "ko": "내 시계는 손목에 있어요."}, {"w": "minute", "m": "분", "ex": "The class starts in five minutes.", "ko": "수업은 5분 후에 시작해요."}, {"w": "bring", "m": "가져오다", "ex": "Bring your book to school.", "ko": "학교에 네 책을 가져와."}, {"w": "warm up", "m": "몸을 풀다", "ex": "We warm up before the game.", "ko": "우리는 경기 전에 몸을 풀어요."}, {"w": "blow", "m": "불다", "ex": "Blow out the candles!", "ko": "촛불을 불어서 꺼!"}, {"w": "direction", "m": "방향", "ex": "Which direction is the park?", "ko": "공원은 어느 방향이니?"}, {"w": "get together", "m": "함께 모이다", "ex": "We get together every Sunday.", "ko": "우리는 일요일마다 함께 모여요."}, {"w": "pour", "m": "붓다", "ex": "Pour the milk into the cup.", "ko": "컵에 우유를 부으세요."}, {"w": "exchange", "m": "교환하다", "ex": "I want to exchange this hat.", "ko": "나는 이 모자를 교환하고 싶어요."}, {"w": "flap", "m": "(날개를) 퍼덕이다", "ex": "The birds flap their wings.", "ko": "새들이 날개를 퍼덕여요."}, {"w": "decorate", "m": "꾸미다", "ex": "We decorate the tree together.", "ko": "우리는 함께 나무를 꾸며요."}, {"w": "complete", "m": "완성하다", "ex": "I complete my homework.", "ko": "나는 숙제를 완성해요."}];

// SET_ID: 이 word_player.html 버전 식별용 일련번호(YYYYMMDD-NN).
// 단어를 바꿔서 새로 배포할 때마다 이 값도 새 날짜/번호로 바꿔줄 것
// (PDF 파일명 규칙과 동일한 형식 — 같이 생성한 PDF와 세트를 맞춰서 추적하기 위함).
var SET_ID = "20260805-07";
document.getElementById('setIdTag').textContent = "세트 " + SET_ID;

// order: 화면에 보여줄 순서(인덱스 배열). 셔플해도 WORDS 자체는 안 건드리고
// 이 배열만 섞어서, 연습 체크 저장은 항상 원래 단어 인덱스(order[i]) 기준으로 함.
var order = WORDS.map(function(_, idx){ return idx; });
var i = 0;
var isShuffled = false;

var startScreen = document.getElementById('startScreen');
var playScreen = document.getElementById('playScreen');
var wordEl = document.getElementById('wordEl');
var meanEl = document.getElementById('meanEl');
var exEl = document.getElementById('exEl');
var koEl = document.getElementById('koEl');
var meanBtn = document.getElementById('meanBtn');
var progressEl = document.getElementById('progress');
var modeTag = document.getElementById('modeTag');
var barFill = document.getElementById('barFill');
var nextBtn = document.getElementById('nextBtn');
var prevBtn = document.getElementById('prevBtn');
var shuffleBtn = document.getElementById('shuffleBtn');
var shuffleStartBtn = document.getElementById('shuffleStartBtn');
var practiceCheck = document.getElementById('practiceCheck');
var practiceResetBtn = document.getElementById('practiceResetBtn');

var statusEl = document.getElementById('statusEl');
var pauseBtn = document.getElementById('pauseBtn');
var autoTimer = null;
var WORD_PAUSE_MS = 2000;     // 단어 재생 후 대기 (문제없다고 확인됨, 그대로 유지)
var MIN_EX_PAUSE_MS = 3200;   // 예문 재생 후 최소 대기 (따라 말하기엔 2초가 너무 짧다는 피드백 반영)
var MAX_EX_PAUSE_MS = 6500;
function examplePauseFor(text){
  // 문장 길이(단어 수)에 비례해서 따라 말할 시간을 넉넉히 줌
  var wordCount = (text || "").trim().split(/\s+/).filter(Boolean).length;
  var ms = wordCount * 480 + 1600;
  return Math.max(MIN_EX_PAUSE_MS, Math.min(MAX_EX_PAUSE_MS, ms));
}
var isPaused = false;
var meanRevealed = false;

function setMeanRevealed(v){
  meanRevealed = v;
  meanEl.style.visibility = v ? "visible" : "hidden";
  koEl.style.visibility = v ? "visible" : "hidden";
  meanBtn.textContent = v ? "뜻 숨기기" : "뜻 보기";
  meanBtn.classList.toggle('is-revealed', v);
}

meanBtn.addEventListener('click', function(){
  setMeanRevealed(!meanRevealed);
});

function clearAutoTimer(){
  if (autoTimer){ clearTimeout(autoTimer); autoTimer = null; }
}

function setPausedUI(paused){
  isPaused = paused;
  pauseBtn.innerHTML = paused ? "&#9658;" : "&#10074;&#10074;";
  pauseBtn.title = paused ? "계속 듣기" : "일시정지";
  pauseBtn.classList.toggle('is-paused', paused);
}

// 기기에 설치된 음성 중 더 자연스러운 걸 우선 선택 (가능하면).
// iOS/iPadOS는 기본으로 저용량 'Compact' 음성을 쓰는 경우가 많아 빠르고 단조롭게
// 들릴 수 있음 — Enhanced/Premium 음성이 설치돼 있으면 그걸 우선 사용.
var selectedVoice = null;
function pickBestVoice(){
  if (!('speechSynthesis' in window)) return;
  var voices = speechSynthesis.getVoices();
  if (!voices || !voices.length) return;
  var enVoices = voices.filter(function(v){
    return v.lang && v.lang.toLowerCase().indexOf('en') === 0;
  });
  if (!enVoices.length) return;
  selectedVoice =
    enVoices.find(function(v){ return /enhanced|premium|neural/i.test(v.name); }) ||
    enVoices.find(function(v){ return v.lang.toLowerCase() === 'en-us' && !/compact/i.test(v.name); }) ||
    enVoices.find(function(v){ return v.lang.toLowerCase() === 'en-us'; }) ||
    enVoices[0];
}
if ('speechSynthesis' in window){
  pickBestVoice();
  speechSynthesis.onvoiceschanged = pickBestVoice;
}

function speak(text, onEnd){
  statusEl.textContent = "";
  if (!('speechSynthesis' in window)){
    statusEl.textContent = "이 브라우저는 음성 재생을 지원하지 않아요.";
    return;
  }
  try{
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US";
    if (selectedVoice) u.voice = selectedVoice;
    u.rate = 0.82;
    u.pitch = 1;
    if (onEnd) u.onend = onEnd;
    u.onerror = function(e){
      statusEl.textContent = "음성 재생 오류: " + (e && e.error ? e.error : "알 수 없음");
    };
    speechSynthesis.speak(u);
  }catch(e){
    statusEl.textContent = "재생 오류: " + e.message;
  }
}

// ---------- 셔플(퀴즈 모드) ----------
function shuffleOrder(){
  for (var k = order.length - 1; k > 0; k--){
    var j = Math.floor(Math.random() * (k+1));
    var tmp = order[k]; order[k] = order[j]; order[j] = tmp;
  }
}
function resetOrderSequential(){
  order = WORDS.map(function(_, idx){ return idx; });
}
function setModeTag(){
  modeTag.classList.toggle('hidden', !isShuffled);
}

// ---------- 연습 체크(Listening/Following/Shadowing) 저장 ----------
// 단어 하나하나가 아니라 "30개 전체를 한 바퀴 돌았는지"를 3회씩 체크하는 구조.
// 예: 30개 전체 Listening 1회 끝 → 체크, Following 1회 끝 → 체크,
//     Shadowing 1회 끝 → 체크, 그다음 다시 Listening 2회차 → 체크 ...
var PRACTICE_KEY = 'wp_set_progress_v1';
var practiceData = { l:[false,false,false], f:[false,false,false], s:[false,false,false] };
try{
  var saved = JSON.parse(localStorage.getItem(PRACTICE_KEY) || 'null');
  if (saved && saved.l && saved.f && saved.s) practiceData = saved;
}catch(e){
  /* 저장된 값이 없거나 손상된 경우 기본값 사용 */
}

function savePractice(){
  try{ localStorage.setItem(PRACTICE_KEY, JSON.stringify(practiceData)); }
  catch(e){ /* 저장소 사용 불가 시 조용히 무시 */ }
}

function renderPracticeChecks(){
  ['l','f','s'].forEach(function(g){
    for (var n = 0; n < 3; n++){
      var cb = practiceCheck.querySelector('input[data-g="'+g+'"][data-n="'+n+'"]');
      if (cb) cb.checked = !!practiceData[g][n];
    }
  });
}

practiceCheck.addEventListener('change', function(e){
  var t = e.target;
  if (!t || t.tagName !== 'INPUT') return;
  var g = t.getAttribute('data-g');
  var n = parseInt(t.getAttribute('data-n'), 10);
  practiceData[g][n] = t.checked;
  savePractice();
});

practiceResetBtn.addEventListener('click', function(){
  practiceData = { l:[false,false,false], f:[false,false,false], s:[false,false,false] };
  savePractice();
  renderPracticeChecks();
});

renderPracticeChecks();

function render(){
  var item = WORDS[order[i]];
  wordEl.textContent = item.w;
  meanEl.textContent = item.m;
  exEl.textContent = item.ex;
  koEl.textContent = item.ko;
  progressEl.textContent = (i+1) + " / " + WORDS.length;
  setModeTag();
  barFill.style.width = ((i+1)/WORDS.length*100) + "%";
  prevBtn.style.visibility = (i === 0) ? "hidden" : "visible";
  nextBtn.textContent = (i === WORDS.length-1) ? "완료 · 처음으로" : "다음 단어";
}

// autoAdvance: 단어 재생 → 2초 뒤 예문 재생 → 2초 뒤 다음 단어로 자동 이동
// (일시정지 중이면 어느 단계에서든 멈춤)
function playCurrent(autoAdvance){
  clearAutoTimer();
  render();
  speak(WORDS[order[i]].w, function(){
    if (!autoAdvance || isPaused) return;
    autoTimer = setTimeout(function(){
      if (isPaused) return;
      var exText = WORDS[order[i]].ex;
      speak(exText, function(){
        if (!autoAdvance || isPaused) return;
        autoTimer = setTimeout(function(){
          if (isPaused) return;
          if (i < WORDS.length - 1){
            i++;
            playCurrent(true);
          } else {
            setMeanRevealed(true);
            wordEl.textContent = "🎉 끝!";
            meanEl.textContent = "처음부터 버튼을 눌러 다시 들어보세요";
            exEl.textContent = "";
            koEl.textContent = "";
            setPausedUI(false);
          }
        }, examplePauseFor(exText));
      });
    }, WORD_PAUSE_MS);
  });
}

pauseBtn.addEventListener('click', function(){
  if (!isPaused){
    setPausedUI(true);
    clearAutoTimer();
    if (window.speechSynthesis && speechSynthesis.speaking){
      speechSynthesis.pause();
    }
  } else {
    setPausedUI(false);
    if (window.speechSynthesis && speechSynthesis.paused){
      speechSynthesis.resume();
    } else {
      playCurrent(true);
    }
  }
});

document.getElementById('startBtn').addEventListener('click', function(){
  isShuffled = false;
  resetOrderSequential();
  startScreen.classList.add('hidden');
  playScreen.classList.remove('hidden');
  i = 0;
  setPausedUI(false);
  setMeanRevealed(false);
  playCurrent(true);
});

shuffleStartBtn.addEventListener('click', function(){
  isShuffled = true;
  resetOrderSequential();
  shuffleOrder();
  startScreen.classList.add('hidden');
  playScreen.classList.remove('hidden');
  i = 0;
  setPausedUI(false);
  setMeanRevealed(false);
  playCurrent(true);
});

shuffleBtn.addEventListener('click', function(){
  isShuffled = true;
  resetOrderSequential();
  shuffleOrder();
  i = 0;
  setPausedUI(false);
  setMeanRevealed(false);
  playCurrent(true);
});

nextBtn.addEventListener('click', function(){
  setPausedUI(false);
  setMeanRevealed(false);
  if (i === WORDS.length-1){
    i = 0;
  } else {
    i++;
  }
  playCurrent(true);
});

prevBtn.addEventListener('click', function(){
  if (i > 0){
    setPausedUI(false);
    setMeanRevealed(false);
    i--;
    playCurrent(true);
  }
});

document.getElementById('replayBtn').addEventListener('click', function(){
  setPausedUI(false);
  playCurrent(true);
});

document.getElementById('restartBtn').addEventListener('click', function(){
  setPausedUI(false);
  setMeanRevealed(false);
  i = 0;
  playCurrent(true);
});

wordEl.addEventListener('click', function(){
  setPausedUI(false);
  playCurrent(true);
});
</script>
</body>
</html>
